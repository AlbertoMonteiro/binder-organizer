<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c62828" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Binder Pokédex" />
    <title>Binder Pokédex</title>
    <base href="/" />
    <script>
        // No GitHub Pages o app fica em /<repositório>/; localmente fica na raiz.
        (function () {
            var m = location.hostname.endsWith('github.io') && location.pathname.match(/^\/[^/]+\//);
            document.querySelector('base').setAttribute('href', m ? m[0] : '/');
        })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
</head>

<body>
    <div id="app">
        <div class="app-loading">Carregando o binder…</div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="fullscreen.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .catch(e => console.warn('Modo offline indisponível', e));
        }
    </script>
</body>

</html>
